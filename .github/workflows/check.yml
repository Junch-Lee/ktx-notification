name: KTX Seat Alert Workflow

on:
  schedule:
    # 5분 간격 자동 실행 (UTC 기준)
    - cron: '*/5 * * * *'
  # GitHub 앱이나 웹페이지에서 수동으로 테스트 실행 가능
  workflow_dispatch:

jobs:
  check-ktx:
    runs-on: ubuntu-latest
    steps:
      - name: Code Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install korail2 requests

      - name: Run KTX Check Script
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          KORAIL_ID: ${{ secrets.KORAIL_ID }}
          KORAIL_PW: ${{ secrets.KORAIL_PW }}
        run: python ktx_alert.py
